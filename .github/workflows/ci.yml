name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # develop/main push 실행은 취소하지 않는다
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      # 우리는 단위·통합·포맷 실패를 한 번에 보려고 --continue를 쓴다
      - run: ./gradlew check --continue --console=plain

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 14
          if-no-files-found: warn
