name: 작업
description: 기능·인프라·테스트·문서 작업
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        제목은 `유형: 내용` 형식이다. 기본값 `feat`를 작업 유형(`feat` `test` `infra` `docs` `chore`)에 맞게 바꾼다.
        이슈 하나는 PR 하나로 끝낼 수 있는 크기로 만든다. 하루 이틀 안에 끝나지 않을 것 같으면 나눈다.
        라벨은 유형(`feat` `test` `infra` `docs` `chore`), 모듈, 우선순위(`must` `should` `could`)를 하나씩 붙인다.

  - type: input
    id: related
    attributes:
      label: 관련 요구사항·정책
      description: 기능·비기능 요구사항 ID와 정책 ID
      placeholder: "F-15, PW-01, EV-04"
    validations:
      required: true

  - type: input
    id: depends
    attributes:
      label: 선행 이슈
      description: 먼저 끝나야 하는 이슈. 없으면 "없음"
      placeholder: "#12, #13"
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 할 일
      description: 체크리스트로 쓴다. 테스트도 할 일에 포함한다
      value: |
        - [ ]
        - [ ] 테스트 작성
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 끝났다고 판단할 수 있는 확인 가능한 조건
      placeholder: "F-01 가입 관련 인수 조건 테스트가 통과한다."
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고
      description: 결정이 필요한 점, 확인할 자료 등 (선택)
