name: 트러블슈팅
description: 원인을 찾기 위해 분석이 필요한 문제 (성능 저하, 간헐적 실패, 장애 등)
title: "troubleshooting: "
labels: ["troubleshooting"]
body:
  - type: markdown
    attributes:
      value: |
        실제로 생긴 문제만 등록한다. 처리 절차는 재현 → 측정 → 원인 분석 → 대안 검토 → 해결 → 같은 조건으로 다시 측정 → 회귀 테스트 → 기록이다.
        공개 저장소이므로 로그·그래프에 비밀값과 개인정보가 없는지 확인한다.

  - type: textarea
    id: symptom
    attributes:
      label: 증상
      description: 무엇이, 언제부터, 얼마나 자주
    validations:
      required: true

  - type: dropdown
    id: found
    attributes:
      label: 발견 경로
      options:
        - 테스트
        - 출시 전 검증
        - 운영 지표·알림
        - 사용자 제보
        - 개발 중
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 조건
      description: 재현하지 못했다면 그 사실도 적는다
      value: |
        - 데이터 규모:
        - 동시 사용자·요청 수:
        - 환경(인스턴스 사양, 커넥션풀 크기 등):
        - 재현 절차:
    validations:
      required: true

  - type: textarea
    id: before
    attributes:
      label: 측정 (개선 전)
      description: 응답 시간 분포, 처리량, 오류율 등 수치
      value: |
        - p50 / p95 / p99:
        - 처리량:
        - 오류율:
        - 기타:

  - type: textarea
    id: evidence
    attributes:
      label: 근거 자료
      description: 실행계획, 스레드 덤프, 지표 그래프, 로그, 추적 ID
      render: shell

  - type: input
    id: related
    attributes:
      label: 관련 기능·요구사항
      placeholder: "F-18, NFR-02"

  - type: checkboxes
    id: confirm
    attributes:
      label: 진행 확인
      options:
        - label: 로그와 첨부에 비밀값·개인정보가 없다
          required: true
        - label: 해결 PR에 재현·회귀 테스트를 포함한다
        - label: 개선 전과 같은 조건으로 다시 측정했다
        - label: 트러블슈팅 기록을 작성하고 발생한 문제 목록을 갱신했다
