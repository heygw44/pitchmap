# 통합 테스트용 프로필이다. 이 프로필에서는 DataSource를 설정하지 않는다.
# DB 접속 정보는 Spring Boot가 Testcontainers의 @ServiceConnection 설정을 읽어 DataSource에 넣어 주므로,
# .env를 읽는 local 설정이 섞이지 않는다.
logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
pitchmap:
  outbox:
    # 테스트가 발행 시점을 직접 정하려고 publishPending()을 호출한다. 그래서 주기적으로 도는 발행기는 끈다.
    publisher-enabled: false
  member:
    unverified-cleanup:
      # 정리 작업을 테스트가 직접 호출한다. 그래서 정해진 시각에 도는 스케줄러는 끈다.
      enabled: false
    reset-throttle-cleanup:
      # 정리 작업을 테스트가 직접 호출한다. 그래서 정해진 시각에 도는 스케줄러는 끈다.
      enabled: false
  publicdata:
    gocamping:
      # 실제 인증키 대신 쓰는 값이다. 클라이언트가 +, /, = 를 퍼센트 인코딩하는지 확인하려고 이 문자를 일부러 넣는다.
      service-key: "test+key/value=="
      # 테스트 픽스처가 몇 건뿐이라, 페이지를 여러 개로 나누어 읽게 하려고 작게 둔다.
      page-size: 2
      # 응답 지연 테스트가 오래 걸리지 않게 짧게 둔다.
      read-timeout: 1s
      sync:
        # 동기화를 테스트가 직접 호출한다. 그래서 정해진 시각에 도는 스케줄러는 끈다.
        enabled: false
    forest:
      # 실제 파일에서 휴양림 3곳의 행만 옮긴 픽스처다. 상대 경로라 Gradle이 테스트를 실행하는 저장소 루트를 기준으로 찾는다.
      file: src/test/resources/fixtures/publicdata/forest/forest_20260325.csv
    park-boundary:
      # 공원 세 곳에 작은 사각형 경계를 지어 넣은 픽스처다. 상대 경로라 Gradle이 테스트를 실행하는 저장소 루트를 기준으로 찾는다.
      file: src/test/resources/fixtures/publicdata/park-boundary/parks_20251231.tsv
