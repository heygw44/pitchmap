# 통합 테스트용 프로필이다. 이 프로필에서는 DataSource를 설정하지 않는다.
# DB 접속 정보는 Spring Boot가 Testcontainers의 @ServiceConnection 설정을 읽어 DataSource에 넣어 주므로,
# .env를 읽는 local 설정이 섞이지 않는다.
logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
pitchmap:
  outbox:
    # 테스트가 발행 시점을 직접 정하려고 publishPending()을 호출한다. 그래서 주기적으로 도는 발행기는 끈다.
    publisher-enabled: false
  member:
    unverified-cleanup:
      # 정리 작업을 테스트가 직접 호출한다. 그래서 정해진 시각에 도는 스케줄러는 끈다.
      enabled: false
