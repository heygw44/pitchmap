spring:
  application:
    name: pitchmap
  profiles:
    # 개발자가 bootRun을 플래그 없이 실행할 수 있도록 local을 기본값으로 둔다.
    # 운영에서는 SPRING_PROFILES_ACTIVE=prod를, 테스트에서는 @ActiveProfiles("test")를 지정해 이 값을 덮어쓴다.
    default: local
  datasource:
    hikari:
      data-source-properties:
        # 시각은 UTC로 저장한다. JVM 기본 시간대와 무관하게 드라이버가 UTC로 변환해야
        # MyBatis가 쓴 Instant가 밀리지 않는다.
        connectionTimeZone: UTC
  jpa:
    # 우리는 트랜잭션을 application 계층에서만 연다.
    # 또한 요청이 끝날 때까지 DB 커넥션을 붙잡는 OSIV(Open Session In View)는 끈다.
    open-in-view: false
    hibernate:
      # 스키마는 Flyway만 만든다. 엔티티가 스키마와 어긋나면 Hibernate가 시작할 때 검증에 실패한다.
      ddl-auto: validate
  session:
    jdbc:
      # SPRING_SESSION 테이블은 Flyway가 만든다. Spring Session이 스키마 스크립트를 따로 실행하지 않게 끈다.
      initialize-schema: never
  mail:
    # 네이버 SMTP는 STARTTLS 587 포트를 쓴다. 평문으로 연결한 뒤 TLS로 올리므로, 올리지 못하면 연결을 끊도록 required까지 켠다.
    # 그렇지 않으면 TLS 없이 인증 정보와 메일 본문이 오갈 수 있다.
    # 계정에 2단계 인증을 켜면 일반 비밀번호로는 SMTP에 로그인할 수 없다. 그래서 MAIL_APP_PASSWORD에는 네이버가 발급한 앱 비밀번호를 넣는다.
    # 이 값들은 비밀값이라 파일에 쓰지 않고 환경 변수로만 받는다. 값이 없으면 앱은 뜨지만 메일 발송은 실패한다.
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # JavaMail의 기본 제한 시간은 무제한이다. SMTP 서버가 응답하지 않으면 메일을 보내는 스레드가 영원히 멈추고,
          # 아웃박스 발행기는 이 스레드 하나로 이벤트를 차례로 처리하므로 다른 이벤트까지 모두 밀린다.
          # 그래서 연결, 읽기, 쓰기에 제한 시간을 둔다. 시간이 지나면 예외가 나고 발행기가 그 이벤트를 나중에 다시 시도한다.
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_READ_TIMEOUT_MS:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

mybatis:
  # 우리는 매퍼 인터페이스를 com.pitchmap.{모듈}.infra에 @Mapper로, XML을 mapper/{모듈}/ 아래에 둔다.
  # classpath*:를 써야 Spring이 main과 test 리소스 루트를 모두 읽는다.
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 이 설정을 켜면 MyBatis가 record 조회 DTO를 열 순서가 아니라 이름으로 매핑한다.
    arg-name-based-constructor-auto-mapping: true
    # 같은 트랜잭션에서 같은 쿼리를 다시 실행하면 MyBatis가 세션 1차 캐시의 이전 결과를 돌려준다.
    # 그래서 그 사이 JPA가 flush한 변경이 보이지 않는다.
    local-cache-scope: statement

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      # 상태 확인을 할 때마다 SMTP 서버에 접속해 보는 검사를 끈다.
      # 외부 메일 서버가 잠시 멈췄다고 앱 전체를 비정상(DOWN)으로 보고 재시작하면 안 되고, 메일 발송 실패는 아웃박스가 재시도로 처리한다.
      enabled: false

springdoc:
  paths-to-match: /api/**

logging:
  pattern:
    correlation: "[%X{traceId:-}] "

pitchmap:
  mail:
    # 네이버 SMTP는 발신 주소가 인증한 계정과 다르면 메일을 거부한다. 그래서 기본값을 SMTP 계정으로 둔다.
    from: ${spring.mail.username:}
  web:
    # 메일 안의 링크에 쓰는 프론트엔드 주소다. 로컬 기본값은 Vite 개발 서버다.
    base-url: ${WEB_BASE_URL:http://localhost:5173}
  publicdata:
    gocamping:
      # 공공데이터포털 인증키(Decoding 키)다. 비밀값이라 파일에 쓰지 않고 환경 변수로만 받는다.
      # 값이 없으면 앱은 뜨지만 고캠핑 API가 인증 오류를 돌려주므로 동기화가 실패한다.
      service-key: ${PUBLICDATA_SERVICE_KEY:}
