spring:
  config:
    # 개발자가 docker compose와 같은 .env를 한 번만 채우면 되도록, Spring은 저장소 루트의 .env를 읽는다.
    # 파일이 없으면 Spring은 무시하고, 같은 이름의 OS 환경 변수가 있으면 그쪽이 우선한다.
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:pitchmap}
    username: ${DB_USERNAME:pitchmap}
    # 비밀번호는 설정 파일에 두지 않는다. 값이 없으면 ${DB_PASSWORD} 문자열이 그대로 비밀번호로 쓰여
    # 시작할 때 Flyway가 DB에 접속하면 MySQL이 거부하므로 앱이 뜨지 않는다.
    password: ${DB_PASSWORD}
pitchmap:
  publicdata:
    forest:
      # 로컬에서는 data/raw/에 받아 둔 파일을 기본으로 쓴다. 상대 경로라 bootRun을 저장소 루트에서 실행해야 이 파일을 찾는다.
      file: ${PUBLICDATA_FOREST_FILE:data/raw/산림청 국립자연휴양림관리소_국립자연휴양림 예약 정책_20260325.csv}
    park-boundary:
      # 로컬에서는 전처리 스크립트가 data/processed/에 만든 파일을 기본으로 쓴다. 상대 경로라 bootRun을 저장소 루트에서 실행해야 이 파일을 찾는다.
      file: ${PUBLICDATA_PARK_BOUNDARY_FILE:data/processed/kdpa-park-boundaries_20251231.tsv}
