spring:
  datasource:
    # 값은 배포 환경(AWS SSM Parameter Store에서 주입한 환경 변수)에서 온다.
    # 운영 값을 코드에 남기지 않으려고 우리는 기본값을 두지 않는다. 값이 빠지면 자리 표시자
    # 문자열이 그대로 값으로 쓰여 앱이 첫 DB 접속에서 실패한다.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

logging:
  structured:
    format:
      # 운영 로그는 수집 에이전트가 Grafana Cloud로 보내서 검색한다. 그래서 필드로 나뉜 JSON(ECS 형식)으로 쓴다.
      # 이 형식은 MDC 값을 필드로 넣으므로, 요청마다 넣는 추적 ID(traceId)로 한 요청의 로그를 모아 볼 수 있다.
      console: ecs
